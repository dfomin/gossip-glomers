[package]
name = "gossip-glomers"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "echo"
path = "src/bin/echo.rs"

[[bin]]
name = "generate"
path = "src/bin/generate.rs"

[[bin]]
name = "broadcast"
path = "src/bin/broadcast.rs"

[[bin]]
name = "gcounter"
path = "src/bin/gcounter.rs"

[[bin]]
name = "kafka"
path = "src/bin/kafka.rs"

[dependencies]
anyhow = "1.0.102"
futures = "0.3.32"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
